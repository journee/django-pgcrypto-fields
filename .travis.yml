language: python
dist: noble
python:
  - 3.12
  - 3.13
  - 3.14
  - 3.15
script: make test-coverage
notifications:
  email: false
services:
  - postgresql
addons:
  postgresql: "16"
before_script:
  - psql -c 'CREATE DATABASE pgcrypto_fields' -U postgres
  - psql -c 'CREATE DATABASE pgcrypto_fields_diff' -U postgres
install:
  - pip install -r requirements_dev.txt
  - pip install $DJANGO
env:
  global:
    - PGUSER=postgres
  matrix:
    - DJANGO='django>=5.2,<5.3'
    - DJANGO='django>=6.0,<6.1'
    - DJANGO='django>=6.1,<6.2'
    - DJANGO='--upgrade --pre django'
matrix:
  fast_finish: true
  exclude:
    # Django 5.2 and 6.0 don't support Python 3.15.
    - python: 3.15
      env: DJANGO='django>=5.2,<5.3'
    - python: 3.15
      env: DJANGO='django>=6.0,<6.1'
  allow_failures:
    - env: DJANGO='--upgrade --pre django'
    # Python 3.15 isn't preinstalled on Travis's noble image yet.
    - python: 3.15
